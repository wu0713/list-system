    <script>
        $(document).ready(function() {
    // 1. 定義美化選項的函數 (加上資料庫圖示)
    function formatState(state) {
        if (!state.id) {
            return state.text;
        }
        // 這裡使用了 FontAwesome 圖示，如果沒載入 CSS 則會顯示空白，但不影響文字
        var $state = $(
            '<span><i class="fa fa-database" style="margin-right: 10px; color: #888;"></i>' + state.text + '</span>'
        );
        return $state;
    };

    // 2. 初始化所有具有 .searchable-select 類別的選單
    // 注意：建議在 HTML 將 select 的 class 加入 "searchable-select"
    // 或者直接用 $('select') 針對頁面上所有選單
    $('.searchable-select').select2({
        placeholder: "請輸入關鍵字搜尋...",
        allowClear: true,
        width: '100%',
        language: {
            searching: function() {
                return "正在從資料庫檢索中...";
            },
            noResults: function() {
                return "查無相關資料";
            }
        },
        templateResult: formatState,
        templateSelection: formatState // 選中後也顯示圖示
    });

    // 3. 模擬從 Java 後端抓取資料並放入不同的選單
    // 假設你有三個選單：#db-select-navy, #db-select-cga, #db-select-af
    
    var navyData = [
        { id: 'P3C_01', text: 'NAVY P3C - 偵測任務 101' },
        { id: 'P3C_02', text: 'NAVY P3C - 巡邏機 A02' }
    ];

    var cgaData = [
        { id: 'CGA_01', text: '海巡署 - 巡防艦 601' },
        { id: 'CGA_02', text: '海巡署 - 岸巡支援隊' }
    ];

    var afData = [
        { id: 'RF16_01', text: 'Air Force RF-16 - 偵照機' },
        { id: 'UAV_01', text: '無人機系統 - 騰雲' }
    ];

    // 封裝一個加入選項的工具
    function populateSelect(elementId, data) {
        var $select = $('#' + elementId);
        data.forEach(function(item) {
            var newOption = new Option(item.text, item.id, false, false);
            $select.append(newOption);
        });
        $select.trigger('change'); // 觸發更新
    }

    // 執行加入動作
    populateSelect('db-select-navy', navyData);
    populateSelect('db-select-cga', cgaData);
    populateSelect('db-select-af', afData);
});
    </script>
