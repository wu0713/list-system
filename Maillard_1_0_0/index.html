    <script>
        document.addEventListener('DOMContentLoaded', function() {
         // 1. 抓取儲存在瀏覽器裡的自定義模板

        customTemplates.forEach(temp => {

            const newLi = document.createElement('li');
            
            // 3. 建立連結 (目前的純前端邏輯會跳轉到一個通用顯示頁，或你可以自行定義)
            // 這裡我們先設定為帶有參數的連結，方便以後擴充功能
            newLi.innerHTML = `<a href="dynamic_page.html?id=${temp.id}">${temp.name}</a>`;
            
            // 4. 將新標籤加入導覽列
            navLinksList.appendChild(newLi);
        });
    }
});

<script>
document.addEventListener('DOMContentLoaded', function() {
    const navUl = document.getElementById('main-nav');
    const customTemplates = JSON.parse(localStorage.getItem('custom_templates') || '[]');

    // --- 1. 插入動態標籤 ---
    customTemplates.forEach(temp => {
        const li = document.createElement('li');
        li.innerHTML = `<a href="javascript:void(0)" class="nav-item" data-target="${temp.id}">${temp.name}</a>`;
        navUl.appendChild(li);

        // 同時為這些動態標籤建立內容容器 (如果還沒建立的話)
        createDynamicSection(temp);
    });

    // --- 2. 統一處理點擊切換 ---
    document.addEventListener('click', function(e) {
        // 檢查點擊的是否為導覽項目
        const targetLink = e.target.closest('.nav-item');
        if (!targetLink) return;

        e.preventDefault();

        // A. 移除所有標籤的 "current" 狀態，並給點擊的標籤加上 "current"
        document.querySelectorAll('#main-nav li').forEach(li => li.classList.remove('current'));
        targetLink.parentElement.classList.add('current');

        // B. 隱藏所有內容區塊 (包含靜態與動態)
        // 假設你的內容區塊都有 "content-section" 這個類別
        document.querySelectorAll('.content-section, .dynamic-section').forEach(sec => {
            sec.style.display = 'none';
        });

        // C. 顯示目標區塊
        const targetId = targetLink.getAttribute('data-target');
        const targetSection = document.getElementById(targetId);
        if (targetSection) {
            targetSection.style.display = 'block';
            // 如果有使用 AOS 動畫，可以在這裡觸發重新整理
            // if (typeof AOS !== 'undefined') AOS.refresh();
        }
    });

    // 建立動態表單內容的函式
    function createDynamicSection(temp) {
        const container = document.getElementById('dynamic-content-area'); // 確保你有這個容器
        if (!container) return;

        const section = document.createElement('section');
        section.id = temp.id;
        section.className = 'dynamic-section';
        section.style.display = 'none';
        section.style.padding = '100px 20px';

        let fieldsHtml = `
            <div style="max-width: 800px; margin: auto;">
                <h2 style="font-family: Montserrat; color: #d84b2a;">${temp.name} 任務紀錄</h2>
                <div class="form-card" style="background: #111; padding: 40px; border: 1px solid #222;">
        `;

        temp.fields.forEach(f => {
            fieldsHtml += `
                <div style="margin-bottom: 20px;">
                    <label style="color:#666; font-size:0.7rem;">${f.label.toUpperCase()}</label>
                    <input type="${f.type}" style="width:100%; background:#1a1a1a; border:1px solid #333; color:white; padding:15px;">
                </div>
            `;
        });

        fieldsHtml += `
                    <button class="btn btn--primary" style="width:100%;">提交數據 (SUBMIT)</button>
                    <button onclick="deleteCategory('${temp.id}')" style="margin-top:20px; background:none; border:none; color:#444; font-size:0.6rem; cursor:pointer;">[ 刪除此自定義類別 ]</button>
                </div>
            </div>`;
        
        section.innerHTML = fieldsHtml;
        container.appendChild(section);
    }
});

function deleteCategory(id) {
    if(confirm('確定刪除？')) {
        let temps = JSON.parse(localStorage.getItem('custom_templates') || '[]');
        temps = temps.filter(t => t.id !== id);
        localStorage.setItem('custom_templates', JSON.stringify(temps));
        location.reload();
    }
}
</script>
