    <script>
        $(document).ready(function() {
            function formatState(state) {
                if (!state.id) return state.text;
                return $('<span><i class="fa fa-database" style="margin-right: 10px; color: #888;"></i>' + state.text + '</span>');
            }

            $('.searchable-select').select2({
                placeholder: "請輸入關鍵字搜尋...",
                allowClear: true,
                width: '100%',
                templateResult: formatState
            });

            // 資料填充
            var cgaData = [{ id: 'CGA_01', text: '嘉義級巡防艦' }, { id: 'CGA_02', text: '安平級執法船' }];
            var navyData = [{ id: 'N_01', text: '成功級巡防艦' }, { id: 'N_02', text: '陀江級軍艦' }];
            var afData = [{ id: 'AF_01', text: '空勤總隊黑鷹直升機' }, { id: 'AF_02', text: '無人機偵蒐小組' }];

            function populate(id, data) {
                var $s = $('#' + id);
                data.forEach(d => $s.append(new Option(d.text, d.id, false, false)));
                $s.trigger('change');
            }

            populate('db-select-cga', cgaData);
            populate('db-select-navy', navyData);
            populate('db-select-af', afData);
        });
    </script>
